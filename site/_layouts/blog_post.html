---
layout: reading
---
<article class="reading-article">
    <header class="reading-heading">
        <h1>{{ page.title | escape }}</h1>
        <p class="reading-byline">
            <span>{{ site.data.profile.primary_name | escape }}</span>
            <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %d, %Y' }}</time>
        </p>
    </header>
    <div class="reading-prose">{{ content }}</div>
</article>
