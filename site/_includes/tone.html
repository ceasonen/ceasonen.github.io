<details class="tone-control" data-tone-control hidden>
    <summary class="tone-toggle" aria-label="Adjust page tone"><span class="tone-swatch" aria-hidden="true"></span></summary>
    <div class="tone-panel">
        <p class="tone-heading">Page tone</p>
        <div class="tone-dial" data-tone-dial>
            <label class="tone-label">
                <span class="tone-visually-hidden">Hue</span>
                <input type="range" min="0" max="359" step="1" value="205" data-tone-input>
            </label>
            <span class="tone-marker" aria-hidden="true"></span>
            <output class="tone-value" data-tone-value aria-hidden="true">205°</output>
        </div>
        <button class="tone-reset" type="button" data-tone-reset>Reset</button>
    </div>
</details>
