<section id="projects" class="home-section">
    <h2>Projects</h2>
    <ul class="project-list">
        {% for project in site.data.projects %}
        <li>
            <a class="project-name" href="{{ project.website | default: project.repository | escape }}" target="_blank" rel="noopener">{{ project.name | escape }}</a><span class="project-summary"> — {{ project.summary | escape }}</span>{% if project.website %} <a class="project-source" href="{{ project.repository | escape }}" target="_blank" rel="noopener" aria-label="{{ project.name | escape }} source code on GitHub">[Code]</a>{% endif %}
        </li>
        {% endfor %}
    </ul>
</section>
