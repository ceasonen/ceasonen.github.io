<section id="research-areas" class="homepage-section">
    <h2><span class="section-glyph" aria-hidden="true">📚</span>Research Areas</h2>
    <p>My research interests include:</p>
    <ul class="research-area-list">
        {% for area in site.data.research %}
        <li>{{ area | escape }}</li>
        {% endfor %}
    </ul>
    <p class="research-contact">
        I welcome conversations about these topics and related research directions. Please feel free to <a href="mailto:{{ site.data.profile.email | encode_email }}">contact me</a>.
    </p>
</section>
