short_bio: >-
  <p>
    I'm <strong>Cheng Chen</strong> (CN name: 陈成), an undergraduate student majoring in Electrical Engineering at the College of Electronic and Information Engineering, <a href="https://www.tongji.edu.cn/" target="_blank"><strong>Tongji University</strong></a>.
  </p>
  <p>
    My research began in my second year with neural operators and the reliability of predicted fields. I now have a first-author paper under review in the NeurIPS 2026 Main Track. This work derives a risk signal from the internal prediction path of a neural operator, allowing unreliable outputs to be identified from a single forward pass (initial scores <strong>4/3/3</strong>). I later worked on knowledge distillation for diabetic retinopathy screening and open-vocabulary audio-visual event localization. The resulting papers, <strong>OrthKD</strong> and <strong>OV-OrthKD</strong>, were accepted at IJCAI 2026 and ACM MM 2026, respectively.
  </p>
  <p>
    <strong>DeepYOLO</strong> grew out of a collaboration with a junior student: I proposed the initial idea, while he led the implementation and experiments; I serve as the corresponding author. My current research interests are multimodal learning, efficient AI, and reasonable AI, and I am looking for PhD opportunities in these and related directions. Learning a new topic deeply and turning it into a concrete result is what makes research rewarding for me.
  </p>

