short_bio: >-
  <p>
    I'm <strong>Cheng Chen</strong> (CN name: <strong>陈成</strong>), an undergraduate student majoring in <strong>Electrical Engineering</strong> at the College of Electronic and Information Engineering, <a href="https://www.tongji.edu.cn/" target="_blank"><strong>Tongji University</strong></a>. I am currently ranked <strong>3/85</strong> in my major.
  </p>
  <p>
    My research started with knowledge distillation for diabetic retinopathy screening. In this work, we studied how a lightweight model can learn from clinical models with different strengths and developed <strong>OrthKD</strong>, which was accepted for an oral presentation at <strong>IJCAI 2026</strong>. I later worked on open-vocabulary audio-visual event localization. Our method, <strong>OV-OrthKD</strong>, separates visual and audio supervision according to their reliability and was accepted for an oral presentation at <strong>ACM MM 2026</strong>.
  </p>
  <p>
    I am currently studying risk assessment for neural operators, with a focus on identifying unreliable predictions from a single forward pass. In another project, I worked on converting images into symbolic scene descriptions so that text-only language models can perform visual question answering.
  </p>
  <p>
    I am looking for PhD opportunities related to multimodal learning, trustworthy machine learning, and machine learning for medical and scientific applications.
  </p>

