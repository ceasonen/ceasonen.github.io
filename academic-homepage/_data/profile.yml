      我就读<a href="https://www.tongji.edu.cn/" target="_blank">同济大学</a>电气工程专业。本科研究主要做<strong>多模态 AI</strong>和<strong>可信 AI</strong>：让模型能处理视觉、语言、音频等多种信息，也让它足够可靠、值得信任。
    </p>
    <p>
