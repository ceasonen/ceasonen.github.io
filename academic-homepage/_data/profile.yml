  <div class="lang-en">
    <p>
      I'm an undergrad at <a href="https://www.tongji.edu.cn/" target="_blank">Tongji University</a>, majoring in electrical engineering. My research is mostly about <strong>multimodal AI</strong> and <strong>trustworthy AI</strong> — building models that work across vision, language, and audio, and making them reliable enough to actually use.
    </p>
    <p>
      I'm looking for PhD opportunities in these areas.
    </p>
