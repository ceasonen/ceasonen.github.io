<nav class="navbar navbar-expand-sm navbar-light fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand"><strong>
            <span class="lang-en">{{site.data.profile.primary_name}}</span>
            <span class="lang-zh">{{site.data.profile.secondary_name}}</span>
        </strong></a>
        <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title or include.active_page == item.name %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}">
                        <span class="lang-en">{{ item.name }}</span>
                        <span class="lang-zh">{{ item.name_zh | default: item.name }}</span>
                    </a>
                </li>
                {% endfor %}
                
                <!-- Desktop Language Toggle -->
                <li class="nav-item pl-2 border-left d-none d-sm-block align-self-center">
                    <a class="nav-link text-muted font-weight-bold" href="#" onclick="toggleLang(); return false;" style="cursor: pointer;">
                        <span class="lang-en"><i class="fas fa-globe"></i> 中文</span>
                        <span class="lang-zh"><i class="fas fa-globe"></i> EN</span>
                    </a>
                </li>
                <!-- Mobile Language Toggle -->
                <li class="nav-item d-block d-sm-none border-top mt-1 pt-1">
                    <a class="nav-link text-muted font-weight-bold" href="#" onclick="toggleLang(); return false;" style="cursor: pointer;">
                        <span class="lang-en"><i class="fas fa-globe"></i> Switch to 中文</span>
                        <span class="lang-zh"><i class="fas fa-globe"></i> Switch to English</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
