<style id="cheng-site-polish">
  :root { --cheng-ink: #172033; --cheng-accent: #7a2438; --cheng-soft: #f7f5f2; }
  body { font-feature-settings: "liga" 1, "kern" 1; }

<script id="cheng-route-cache-bust">
(() => {
  const version = "20260530-b53a352";
  const routePaths = new Set(["/publications/", "/news/", "/awards/"]);
  const versionedHref = (href) => {
    try {
      const url = new URL(href, window.location.href);
      if (!routePaths.has(url.pathname)) return null;
      url.searchParams.set("v", version);
      return url.pathname + url.search + url.hash;
    } catch (error) {
      return null;
    }
  };

  const refreshNavLinks = () => {
    document.querySelectorAll('a[href]').forEach((anchor) => {
      const next = versionedHref(anchor.getAttribute("href"));
      if (next) anchor.setAttribute("href", next);
    });
  };

  document.addEventListener("DOMContentLoaded", refreshNavLinks);
  document.addEventListener("click", (event) => {
    const anchor = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if (!anchor) return;
    const next = versionedHref(anchor.href);
    if (!next) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    window.location.assign(next);
  }, true);
})();
</script>

<script id="cheng-footer-fix">
(() => {
  const legacyName = "PRI" + "SM";
  const legacyEn = ["Built", "with", legacyName].join(" ");
  const legacyZh = "由 " + legacyName + " 构建";
  const legacyRepo = new RegExp("github\\.com\\/xyjoey\\/" + legacyName, "i");
  const legacyEnPattern = new RegExp(["Built", "with", legacyName].join("\\s+"), "g");
  const legacyZhPattern = new RegExp("由\\s+" + legacyName + "\\s+构建", "g");
  const fixFooter = () => {
    document.querySelectorAll("footer a, footer span, footer p").forEach((node) => {
      const text = (node.textContent || "").trim();
      if (text === legacyEn || text === legacyZh) {
        node.textContent = "Built by Cheng Chen";
      }
      if (node.tagName === "A" && legacyRepo.test(node.getAttribute("href") || "")) {
        const span = document.createElement("span");
        span.textContent = "Built by Cheng Chen";
        node.replaceWith(span);
      }
    });
    document.querySelectorAll("footer").forEach((footer) => {
      footer.innerHTML = footer.innerHTML
        .replace(legacyEnPattern, "Built by Cheng Chen")
        .replace(legacyZhPattern, "Built by Cheng Chen")
        .replace(/\s*🚀\s*/g, "");
    });
  };
  document.addEventListener("DOMContentLoaded", () => {
    fixFooter();
    new MutationObserver(fixFooter).observe(document.body, { childList: true, subtree: true, characterData: true });
  });
  fixFooter();
})();
</script>
